version: 1

filesystem_policy:
  include_workdir: false
  read_only: [/bin, /usr, /lib, /lib64, /opt/codex, /opt/android-sdk, /etc, /proc, /dev/urandom, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]

landlock:
  compatibility: hard_requirement

network_policies:
  codex_subscription:
    binaries:
      - path: /opt/codex/bin/codex
    endpoints:
      - host: auth.openai.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: POST, path: /api/accounts/deviceauth/**}
          - allow: {method: GET, path: /api/accounts/deviceauth/**}
          - allow: {method: POST, path: /oauth/token}
      - host: chatgpt.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: GET, path: /backend-api/codex/**}
          - allow: {method: POST, path: /backend-api/codex/**}
          # Required during account/read bootstrap for workspace discovery.
          - allow: {method: GET, path: /backend-api/wham/accounts/check}
      - host: ab.chatgpt.com
        port: 443

  codex_github:
    binaries:
      - path: /opt/codex/bin/codex
    endpoints:
      - {host: api.github.com, port: 443, protocol: rest, enforcement: enforce, access: read-only}
      - {host: raw.githubusercontent.com, port: 443, protocol: rest, enforcement: enforce, access: read-only}

  git:
    binaries:
      - path: /usr/lib/git-core/git-remote-http
    endpoints:
      - host: github.com
        port: 443

  java:
    binaries:
      - path: /sandbox/.local/jdks/*/bin/java
      - path: /sandbox/.local/jdks/*/bin/java-native
    endpoints:
      - {host: plugins-artifacts.gradle.org, port: 443, protocol: rest, enforcement: enforce, access: read-only}
      - {host: plugins.gradle.org, port: 443, protocol: rest, enforcement: enforce, access: read-only}
      - {host: services.gradle.org, port: 443, protocol: rest, enforcement: enforce, access: read-only}
      - {host: repo.maven.apache.org, port: 443, protocol: rest, enforcement: enforce, access: read-only}
      - {host: dl.google.com, port: 443, protocol: rest, enforcement: enforce, access: read-only}
      - {host: download.eclipse.org, port: 443, protocol: rest, enforcement: enforce, access: read-only}
      - {host: groovy.jfrog.io, port: 443, protocol: rest, enforcement: enforce, access: read-only}
      - {host: storage.googleapis.com, port: 443, protocol: rest, enforcement: enforce, access: read-only}
      - {host: download.jetbrains.com, port: 443, protocol: rest, enforcement: enforce, access: read-only}
      - {host: download-cdn.jetbrains.com, port: 443, protocol: rest, enforcement: enforce, access: read-only}
